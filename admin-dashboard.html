<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - FoodShare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-page">

    <header class="admin-header">

        <a href="index.html" class="admin-logo">
            FoodShare
        </a>

        <span class="admin-label">
            Administrator
        </span>

    </header>


    <main class="admin-main">

        <div class="admin-title">

            <h1>Admin Dashboard</h1>

            <p>
                Monitor and manage the FoodShare platform.
            </p>

        </div>


        <section class="admin-stats">

            <div>
                <span>Total Users</span>
                <strong>245</strong>
            </div>

            <div>
                <span>Registered NGOs</span>
                <strong>32</strong>
            </div>

            <div>
                <span>Total Donations</span>
                <strong>156</strong>
            </div>

            <div>
                <span>Pending Requests</span>
                <strong>14</strong>
            </div>

        </section>


        <section class="admin-panel">

            <h2>Pending NGO Verifications</h2>

            <div class="admin-row">

                <div>
                    <strong>Helping Hands Foundation</strong>
                    <p>Palwal, Haryana</p>
                </div>

                <div>
                    <button class="approve-btn">
                        Approve
                    </button>

                    <button class="reject-btn">
                        Reject
                    </button>
                </div>

            </div>


            <div class="admin-row">

                <div>
                    <strong>Hope Food Foundation</strong>
                    <p>Faridabad, Haryana</p>
                </div>

                <div>
                    <button class="approve-btn">
                        Approve
                    </button>

                    <button class="reject-btn">
                        Reject
                    </button>
                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
